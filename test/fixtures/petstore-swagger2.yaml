swagger: "2.0"
info:
  title: Petstore (Swagger 2.0)
  version: "1.0.0"
basePath: /
paths:
  /pets:
    get:
      tags: [pets]
      summary: List pets
      parameters:
        - name: limit
          in: query
          required: true
          type: integer
          minimum: 1
          maximum: 50
      responses:
        "200":
          description: A list of pets
          schema:
            type: array
            items:
              $ref: "#/definitions/Pet"
    post:
      tags: [pets]
      summary: Create a pet
      parameters:
        - name: pet
          in: body
          required: true
          schema:
            $ref: "#/definitions/NewPet"
      responses:
        "201":
          description: Created
          schema:
            $ref: "#/definitions/Pet"
          examples:
            application/json:
              id: 1
              name: Rex
              tag: dog
  /pets/{petId}:
    parameters:
      - name: petId
        in: path
        required: true
        type: integer
    get:
      tags: [pets]
      summary: Get a pet
      responses:
        "200":
          description: A pet
          schema:
            $ref: "#/definitions/Pet"
        "404":
          description: Not found
          schema:
            $ref: "#/definitions/Error"
definitions:
  Pet:
    type: object
    required: [id, name]
    properties:
      id:
        type: integer
        format: int64
        readOnly: true
      name:
        type: string
        minLength: 1
      tag:
        type: string
        enum: [dog, cat, bird]
  NewPet:
    type: object
    required: [name]
    properties:
      name:
        type: string
        minLength: 1
      tag:
        type: string
        enum: [dog, cat, bird]
  Error:
    type: object
    required: [code, message]
    properties:
      code:
        type: integer
      message:
        type: string
